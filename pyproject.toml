[project]
name = "janescriber"
version = "0.1.0"
description = "Jane family local AI audio and video transcription studio"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "customtkinter>=5.2.2",
  "numpy>=1.26.0",
  "openai-whisper>=20240930",
  "pillow>=10.0.0",
  "psutil>=5.9.0",
  "proc-tap>=1.1.1; sys_platform == 'win32'",
  "soundcard>=0.4.6",
  "sounddevice>=0.5.1",
  "transformers>=4.45,<5",
  "vosk>=0.3.45",
  "torch>=2.7.1,<2.8; sys_platform != 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
qwen = [
  "qwen-asr==0.0.6",
  "torchvision>=0.22.1,<0.23",
]

[project.scripts]
janescriber = "janescriber.__main__:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.0",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
