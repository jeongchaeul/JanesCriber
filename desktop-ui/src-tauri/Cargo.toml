[package]
name = "janescriber-studio"
version = "1.0.0"
description = "The modern JanesCriber desktop surface"
authors = ["project//aspyr"]
edition = "2021"

[lib]
name = "janescriber_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
